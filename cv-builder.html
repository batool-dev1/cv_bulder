<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مولد السيرة الذاتية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Readex+Pro:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* التخطيط: لوحة تحرير على اليمين ومعاينة A4 حية ثابتة على اليسار، وعلى الجوال تتراص العناصر */
:root {
  --ink: #0f1b2d;
  --ink-soft: #3b475c;
  --muted: #6b7587;
  --line: #dfe3ea;
  --bg: #eef0f4;
  --card: #ffffff;
  --ui: #0f766e;
  --ui-hover: #0b5f59;
  --ui-tint: #e3f3f1;
  --danger: #c0392b;
  --font-body: 'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, sans-serif;
  --font-display: 'Readex Pro', 'IBM Plex Sans Arabic', Tahoma, sans-serif;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  font-family: var(--font-body);
  background: var(--bg);
  color: var(--ink);
  font-size: 15px;
  line-height: 1.6;
}
button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--ui); outline-offset: 2px; }

/* ===== الشريط العلوي ===== */
.topbar {
  position: sticky; top: 0; z-index: 20;
  background: var(--ink); color: #fff;
}
.topbar-in {
  max-width: 1480px; margin: 0 auto;
  padding: 12px 20px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
}
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.brand-mark {
  width: 34px; height: 34px; border-radius: 8px; background: var(--ui);
  display: grid; place-items: center; flex: none;
}
.brand-mark svg { width: 18px; height: 18px; stroke: #fff; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.brand h1 { margin: 0; font-family: var(--font-display); font-size: 1.05rem; font-weight: 600; }
.brand small { display: block; color: #9fb0c8; font-size: .75rem; font-weight: 300; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.btn {
  border: 1px solid transparent; border-radius: 8px; padding: 8px 14px;
  font-weight: 500; font-size: .85rem; display: inline-flex; align-items: center; gap: 6px;
  background: transparent; transition: background .15s, border-color .15s;
}
.btn svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.btn-ghost { border-color: #34435c; color: #dbe4f2; }
.btn-ghost:hover { background: #1b2a42; }
.btn-primary { background: var(--ui); color: #fff; }
.btn-primary:hover { background: var(--ui-hover); }

/* ===== البنية ===== */
.layout {
  max-width: 1480px; margin: 0 auto;
  padding: 22px 20px 60px;
  display: grid; grid-template-columns: minmax(0, 520px) minmax(0, 1fr); gap: 26px; align-items: start;
}
.editor { display: flex; flex-direction: column; gap: 14px; min-width: 0; }

/* بطاقات التحرير */
.panel {
  background: var(--card); border: 1px solid var(--line); border-radius: 12px;
}
.panel > summary {
  list-style: none; cursor: pointer;
  display: flex; align-items: center; gap: 10px;
  padding: 14px 16px; font-family: var(--font-display); font-weight: 600; font-size: .95rem;
}
.panel > summary::-webkit-details-marker { display: none; }
.panel > summary .ic { width: 18px; height: 18px; stroke: var(--ui); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.panel > summary .chev { margin-inline-start: auto; width: 16px; height: 16px; stroke: var(--muted); fill: none; stroke-width: 2; transition: transform .2s; }
.panel[open] > summary .chev { transform: rotate(180deg); }
.panel-body { padding: 4px 16px 16px; display: flex; flex-direction: column; gap: 12px; }

.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field.full { grid-column: 1 / -1; }
.field label { font-size: .78rem; font-weight: 500; color: var(--ink-soft); }
.field input, .field select, .field textarea {
  width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px;
  background: #fff; transition: border-color .15s, box-shadow .15s; min-width: 0;
}
.field textarea { resize: vertical; min-height: 84px; line-height: 1.7; }
.field input:focus, .field select:focus, .field textarea:focus {
  outline: none; border-color: var(--ui); box-shadow: 0 0 0 3px rgba(15,118,110,.14);
}
.ltr { direction: ltr; text-align: left; }
.hint { font-size: .75rem; color: var(--muted); margin: 0; }

/* القوالب والألوان */
.tpl-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.tpl {
  border: 1.5px solid var(--line); background: #fff; border-radius: 10px; padding: 8px 8px 10px;
  display: flex; flex-direction: column; gap: 8px; align-items: stretch; text-align: center; font-size: .8rem; font-weight: 500;
}
.tpl[aria-pressed="true"] { border-color: var(--ui); background: var(--ui-tint); }
.tpl svg { width: 100%; height: 54px; display: block; }
.swatches { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.sw {
  width: 28px; height: 28px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px var(--line);
  padding: 0;
}
.sw[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--ink); }
.sw-custom { width: 28px; height: 28px; padding: 0; border: 0; background: none; border-radius: 50%; overflow: hidden; }

/* الصورة */
.photo-row { display: flex; align-items: center; gap: 14px; }
.photo-thumb {
  width: 64px; height: 64px; border-radius: 50%; background: #eef0f4 center/cover no-repeat;
  border: 1px solid var(--line); flex: none; display: grid; place-items: center; color: var(--muted);
}
.photo-thumb svg { width: 26px; height: 26px; stroke: currentColor; fill: none; stroke-width: 1.6; }
.photo-btns { display: flex; gap: 8px; flex-wrap: wrap; }
.btn-line { border-color: var(--line); background: #fff; color: var(--ink-soft); padding: 7px 12px; }
.btn-line:hover { border-color: var(--ui); color: var(--ui); }
.btn-line.danger:hover { border-color: var(--danger); color: var(--danger); }

/* اقتراحات النبذة */
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  border: 1px solid var(--line); background: #f7f8fa; border-radius: 999px; padding: 5px 12px; font-size: .78rem;
}
.chip:hover { background: var(--ui); color: #fff; border-color: var(--ui); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: #fff; padding: 4px 12px; font-size: .78rem; }
.seg button[aria-pressed="true"] { background: var(--ink); color: #fff; }
.sugg-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.sugg-head span { font-size: .78rem; color: var(--muted); }

/* عناصر قابلة للتكرار */
.item { border: 1px solid var(--line); border-radius: 10px; padding: 12px; background: #fafbfc; display: flex; flex-direction: column; gap: 10px; }
.item-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.item-head b { font-size: .8rem; color: var(--ink-soft); font-weight: 600; }
.item-tools { display: flex; gap: 4px; }
.icon-btn {
  width: 28px; height: 28px; border-radius: 6px; border: 1px solid var(--line); background: #fff;
  display: grid; place-items: center; padding: 0; color: var(--ink-soft);
}
.icon-btn svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.icon-btn:hover { border-color: var(--ui); color: var(--ui); }
.icon-btn.del:hover { border-color: var(--danger); color: var(--danger); }
.icon-btn:disabled { opacity: .35; cursor: default; pointer-events: none; }
.add-btn {
  border: 1.5px dashed #b5beca; background: transparent; border-radius: 10px; padding: 9px; font-weight: 500;
  color: var(--ink-soft); display: flex; align-items: center; justify-content: center; gap: 6px;
}
.add-btn:hover { border-color: var(--ui); color: var(--ui); background: var(--ui-tint); }
.add-btn svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; }
.empty { font-size: .82rem; color: var(--muted); text-align: center; padding: 6px 0; margin: 0; }

/* ===== المعاينة ===== */
.preview-col { position: sticky; top: 76px; min-width: 0; }
.preview-bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
.preview-bar .label { font-size: .82rem; font-weight: 600; color: var(--ink-soft); }
.status { font-size: .76rem; font-weight: 500; padding: 4px 11px; border-radius: 999px; background: #e1f3e8; color: #1b6b3a; }
.status.warn { background: #fdebd3; color: #8a4a05; }
.stage { width: 100%; overflow: hidden; }
.paper-wrap { transform-origin: top right; width: 794px; }

/* ===== ورقة السيرة (A4 = 794 × 1123 بكسل) ===== */
.cv {
  --a: #0d9488;
  width: 794px; min-height: 1123px; background: #fff; color: #1d2636;
  padding: 46px 52px; font-size: 13.2px; line-height: 1.65;
  box-shadow: 0 18px 44px rgba(15,27,45,.16);
  font-family: var(--font-body);
}
.cv h1, .cv h2, .cv h3 { font-family: var(--font-display); margin: 0; }
.cv .name { font-size: 30px; font-weight: 700; line-height: 1.25; color: #0f1b2d; }
.cv .role { font-size: 15px; font-weight: 500; color: var(--a); margin-top: 2px; }
.cv .contacts { display: flex; flex-wrap: wrap; gap: 4px 18px; margin: 0; padding: 0; list-style: none; font-size: 12px; color: #4a566b; }
.cv .contacts li { display: inline-flex; align-items: center; gap: 6px; }
.cv .contacts svg { width: 13px; height: 13px; stroke: var(--a); fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.cv .photo { width: 92px; height: 92px; border-radius: 50%; background: center/cover no-repeat; flex: none; }
.cv-sec { margin-top: 20px; break-inside: auto; }
.cv-sec h3 { font-size: 13px; font-weight: 700; color: #0f1b2d; margin-bottom: 8px; letter-spacing: .2px; }
.entry { margin-bottom: 11px; break-inside: avoid; }
.entry-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.entry-title { font-weight: 600; font-size: 13.6px; color: #0f1b2d; }
.entry-date { font-size: 11.5px; color: #6b7587; white-space: nowrap; font-variant-numeric: tabular-nums; }
.entry-sub { font-size: 12.6px; font-weight: 500; color: var(--a); }
.desc { margin-top: 3px; color: #323d52; }
.desc p { margin: 0 0 2px; }
.desc .bl { position: relative; padding-inline-start: 14px; }
.desc .bl::before { content: ""; position: absolute; inset-inline-start: 2px; top: .72em; width: 4px; height: 4px; border-radius: 50%; background: var(--a); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { background: #f0f2f6; border-radius: 5px; padding: 2px 10px; font-size: 12px; font-weight: 500; color: #243049; }
.lang-row { display: flex; justify-content: space-between; gap: 10px; font-size: 12.6px; padding: 2px 0; }
.lang-row span:last-child { color: #6b7587; }
.ph { color: #9aa3b2; }

/* القالب العصري */
.cv.t-modern { border-top: 8px solid var(--a); }
.t-modern .head { display: flex; align-items: center; gap: 20px; padding-bottom: 16px; border-bottom: 1px solid #e3e7ee; }
.t-modern .head-text { flex: 1; min-width: 0; }
.t-modern .contacts { margin-top: 10px; }
.t-modern .cv-sec h3 { display: flex; align-items: center; gap: 10px; color: var(--a); }
.t-modern .cv-sec h3::after { content: ""; flex: 1; height: 1px; background: #e3e7ee; }

/* القالب الكلاسيكي */
.t-classic .head { background: #0f1b2d; color: #fff; margin: -46px -52px 8px; padding: 34px 52px 26px; display: flex; align-items: center; gap: 20px; }
.t-classic .head-text { flex: 1; min-width: 0; }
.t-classic .name { color: #fff; }
.t-classic .role { color: #b9c6dc; }
.t-classic .contacts { margin-top: 12px; color: #d6deec; }
.t-classic .contacts svg { stroke: #b9c6dc; }
.t-classic .photo { box-shadow: 0 0 0 3px rgba(255,255,255,.25); }
.t-classic .cv-sec h3 { border-bottom: 2px solid #0f1b2d; padding-bottom: 3px; text-transform: uppercase; }
.t-classic .entry-sub { color: #3b475c; }

/* القالب الجانبي */
.cv.t-side { padding: 0; display: grid; grid-template-columns: 236px 1fr; }
.t-side .side { background: #0f1b2d; color: #e6ecf6; padding: 40px 24px; }
.t-side .main { padding: 44px 36px 44px 40px; min-width: 0; }
.t-side .photo { width: 120px; height: 120px; margin: 0 auto 18px; box-shadow: 0 0 0 3px var(--a); }
.t-side .side .cv-sec h3 { color: #fff; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; padding-bottom: 5px; border-bottom: 2px solid var(--a); display: inline-block; }
.t-side .contacts { flex-direction: column; gap: 8px; color: #dbe4f2; font-size: 12px; }
.t-side .contacts li { align-items: flex-start; word-break: break-word; }
.t-side .contacts svg { stroke: var(--a); margin-top: 3px; }
.t-side .tag { background: rgba(255,255,255,.1); color: #e6ecf6; }
.t-side .lang-row span:last-child { color: #9fb0c8; }
.t-side .head-main { padding-bottom: 14px; border-bottom: 1px solid #e3e7ee; }
.t-side .main .cv-sec h3 { color: var(--a); }

/* ===== التجاوب ===== */
@media (max-width: 1100px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  .preview-col { position: static; }
}
@media (max-width: 560px) {
  .grid2 { grid-template-columns: 1fr; }
  .tpl-row { grid-template-columns: 1fr; }
  .tpl svg { height: 44px; }
  .topbar-in, .layout { padding-inline: 14px; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}

/* ===== الطباعة / حفظ PDF ===== */
@page { size: A4; margin: 0; }
@media print {
  html, body { background: #fff !important; }
  .no-print { display: none !important; }
  .layout { display: block; padding: 0; max-width: none; }
  .preview-col { position: static; }
  .stage { overflow: visible; height: auto !important; }
  .paper-wrap { transform: none !important; width: 210mm; }
  .cv { box-shadow: none; width: 210mm; min-height: 297mm; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .t-side .side { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}
</style>
</head>
<body>

<header class="topbar no-print">
  <div class="topbar-in">
    <div class="brand">
      <div class="brand-mark"><svg viewBox="0 0 24 24"><path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5"/><path d="M10 13h6M10 17h6"/></svg></div>
      <div>
        <h1>مولد السيرة الذاتية</h1>
        <small>تُحفظ بياناتك تلقائيًا على جهازك</small>
      </div>
    </div>
    <div class="actions">
      <button class="btn btn-ghost" id="btnSample" type="button">بيانات تجريبية</button>
      <button class="btn btn-ghost" id="btnClear" type="button">مسح الكل</button>
      <button class="btn btn-ghost" id="btnExport" type="button"><svg viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>حفظ نسخة JSON</button>
      <button class="btn btn-ghost" id="btnImport" type="button"><svg viewBox="0 0 24 24"><path d="M12 15V4M7 9l5-5 5 5M5 20h14"/></svg>استيراد</button>
      <button class="btn btn-primary" id="btnPrint" type="button"><svg viewBox="0 0 24 24"><path d="M7 9V3h10v6M7 17H4v-6h16v6h-3M7 14h10v7H7z"/></svg>طباعة / حفظ PDF</button>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
    </div>
  </div>
</header>

<main class="layout">

  <!-- ===== لوحة التحرير ===== -->
  <section class="editor no-print" aria-label="محرر السيرة الذاتية">

    <details class="panel" open>
      <summary>
        <svg class="ic" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
        التصميم والألوان
        <svg class="chev" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>
      </summary>
      <div class="panel-body">
        <div class="tpl-row" id="tplRow" role="group" aria-label="القالب">
          <button class="tpl" type="button" data-tpl="modern" aria-pressed="true">
            <svg viewBox="0 0 90 54"><rect width="90" height="54" rx="3" fill="#fff" stroke="#dfe3ea"/><rect width="90" height="4" fill="#0d9488"/><circle cx="14" cy="16" r="6" fill="#dfe3ea"/><rect x="24" y="11" width="34" height="5" rx="2" fill="#0f1b2d"/><rect x="24" y="19" width="22" height="3" rx="1.5" fill="#0d9488"/><rect x="8" y="30" width="74" height="2" rx="1" fill="#dfe3ea"/><rect x="8" y="36" width="60" height="2" rx="1" fill="#dfe3ea"/><rect x="8" y="42" width="68" height="2" rx="1" fill="#dfe3ea"/></svg>
            عصري
          </button>
          <button class="tpl" type="button" data-tpl="classic" aria-pressed="false">
            <svg viewBox="0 0 90 54"><rect width="90" height="54" rx="3" fill="#fff" stroke="#dfe3ea"/><rect width="90" height="22" rx="3" fill="#0f1b2d"/><rect x="8" y="6" width="34" height="5" rx="2" fill="#fff"/><rect x="8" y="14" width="22" height="3" rx="1.5" fill="#8fa2c0"/><rect x="8" y="30" width="30" height="3" rx="1.5" fill="#0f1b2d"/><rect x="8" y="37" width="74" height="2" rx="1" fill="#dfe3ea"/><rect x="8" y="43" width="62" height="2" rx="1" fill="#dfe3ea"/></svg>
            تنفيذي
          </button>
          <button class="tpl" type="button" data-tpl="side" aria-pressed="false">
            <svg viewBox="0 0 90 54"><rect width="90" height="54" rx="3" fill="#fff" stroke="#dfe3ea"/><path d="M62 0h25a3 3 0 0 1 3 3v48a3 3 0 0 1-3 3H62z" fill="#0f1b2d"/><circle cx="76" cy="12" r="6" fill="#0d9488"/><rect x="68" y="24" width="16" height="2" rx="1" fill="#8fa2c0"/><rect x="68" y="30" width="12" height="2" rx="1" fill="#8fa2c0"/><rect x="8" y="9" width="30" height="5" rx="2" fill="#0f1b2d"/><rect x="8" y="22" width="44" height="2" rx="1" fill="#dfe3ea"/><rect x="8" y="28" width="38" height="2" rx="1" fill="#dfe3ea"/><rect x="8" y="34" width="42" height="2" rx="1" fill="#dfe3ea"/></svg>
            جانبي
          </button>
        </div>
        <div class="field">
          <label>لون التمييز</label>
          <div class="swatches" id="swatches" role="group" aria-label="لون التمييز"></div>
        </div>
      </div>
    </details>

    <details class="panel" open>
      <summary>
        <svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
        المعلومات الشخصية
        <svg class="chev" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>
      </summary>
      <div class="panel-body">
        <div class="photo-row">
          <div class="photo-thumb" id="photoThumb"><svg viewBox="0 0 24 24"><circle cx="12" cy="9" r="3.5"/><path d="M5 20a7 7 0 0 1 14 0"/></svg></div>
          <div>
            <div class="photo-btns">
              <button class="btn btn-line" id="btnPhoto" type="button">اختيار صورة</button>
              <button class="btn btn-line danger" id="btnPhotoRemove" type="button" hidden>إزالة</button>
            </div>
            <p class="hint">اختيارية. يُفضّل حذفها عند التقديم على شركات تستخدم أنظمة ATS.</p>
          </div>
          <input type="file" id="photoFile" accept="image/*" hidden>
        </div>
        <div class="grid2">
          <div class="field"><label for="name">الاسم الكامل</label><input id="name" data-k="name" type="text" autocomplete="name"></div>
          <div class="field"><label for="title">المسمى الوظيفي</label><input id="title" data-k="title" type="text"></div>
          <div class="field"><label for="email">البريد الإلكتروني</label><input id="email" data-k="email" class="ltr" type="email" autocomplete="email"></div>
          <div class="field"><label for="phone">رقم الهاتف</label><input id="phone" data-k="phone" class="ltr" type="tel" autocomplete="tel"></div>
          <div class="field"><label for="location">المدينة / البلد</label><input id="location" data-k="location" type="text"></div>
          <div class="field"><label for="linkedin">LinkedIn</label><input id="linkedin" data-k="linkedin" class="ltr" type="text" placeholder="linkedin.com/in/username"></div>

      ['سيرفرات وشبكات', 'متخصص في تصميم وإدارة الشبكات والخوادم بموثوقية عالية، ولدي خبرة في مشاريع التحول الرقمي.'],

  var SAMPLE = {
    template: 'modern', accent: '#0d9488', gender: 'f', photo: '',
    name: 'سارة محمود', title: 'مهندسة برمجيات',

    skills: 'Python, Flask, JavaScript, HTML5 / CSS3, SQL Server, Active Directory, Git, Linux',

      { id: uid(), title: 'مهندسة برمجيات', company: 'شركة الحلول التقنية', dates: '2023 - الحالي',
        desc: 'تطوير وصيانة لوحات تحكم ويب باستخدام Flask وBootstrap\nتحسين استعلامات قواعد البيانات وخفض زمن الاستجابة بنسبة 25%\nكتابة اختبارات آلية ورفع تغطية الكود' },

  var EMPTY = {
    template: 'modern', accent: '#0d9488', gender: 'f', photo: '',

  /* ---------- أدوات ---------- */
  function $(s, r) { return (r || document).querySelector(s); }

  function uid() { return Math.random().toString(36).slice(2, 9); }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function ltr(s) { return '<bdi dir="ltr">' + esc(s) + '</bdi>'; }

  function load() {
    try {
      var raw = localStorage.getItem(STORE_KEY);
      if (!raw) return null;
      return normalize(JSON.parse(raw));
    } catch (e) { return null; }
  }
  var saveTimer = null;
  function save() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function () {
      try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {}
    }, 250);
  }
  function normalize(d) {
    var out = clone(EMPTY);
    Object.keys(out).forEach(function (k) {
      if (d && d[k] !== undefined && typeof d[k] === typeof out[k]) out[k] = d[k];
    });
    ['exp', 'edu', 'langs', 'certs'].forEach(function (k) {
      out[k] = (Array.isArray(d && d[k]) ? d[k] : []).map(function (it) {
        var item = clone(LISTS[k].blank);
        Object.keys(item).forEach(function (f) { if (typeof it[f] === 'string') item[f] = it[f]; });
        item.id = uid();
        return item;
      });
    });
    return out;
  }

  /* ---------- بناء المعاينة ---------- */
  function lines(text) {
    return String(text || '').split(/\r?\n/).map(function (l) { return l.trim(); }).filter(Boolean)
      .map(function (l) {
        var m = l.match(/^[-•*·▪]\s*(.*)$/);
        return m ? '<p class="bl">' + esc(m[1]) + '</p>' : '<p>' + esc(l) + '</p>';
      }).join('');
  }
  function bulletsAuto(text) {
    // كل سطر نقطة إذا كان في النص أكثر من سطر
    var arr = String(text || '').split(/\r?\n/).map(function (l) { return l.trim(); }).filter(Boolean);
    if (arr.length < 2) return lines(text);
    return arr.map(function (l) {
      return '<p class="bl">' + esc(l.replace(/^[-•*·▪]\s*/, '')) + '</p>';
    }).join('');
  }
  function section(title, body) {
    return body ? '<section class="cv-sec"><h3>' + title + '</h3>' + body + '</section>' : '';
  }
  function contactItems() {
    var s = state, out = [];
    if (s.email) out.push('<li>' + ICONS.mail + ltr(s.email) + '</li>');
    if (s.phone) out.push('<li>' + ICONS.phone + ltr(s.phone) + '</li>');
    if (s.location) out.push('<li>' + ICONS.pin + '<span>' + esc(s.location) + '</span></li>');
    if (s.linkedin) out.push('<li>' + ICONS.link + ltr(s.linkedin) + '</li>');
    if (s.github) out.push('<li>' + ICONS.code + ltr(s.github) + '</li>');
    return out.length ? '<ul class="contacts">' + out.join('') + '</ul>' : '';
  }
  function photoHTML() {
    return state.photo ? '<div class="photo" style="background-image:url(\'' + state.photo + '\')"></div>' : '';
  }
  function expHTML() {
    return state.exp.filter(function (e) { return e.title || e.company; }).map(function (e) {
      return '<div class="entry"><div class="entry-top"><span class="entry-title">' + esc(e.title) + '</span>' +
        '<span class="entry-date">' + esc(e.dates) + '</span></div>' +
        (e.company ? '<div class="entry-sub">' + esc(e.company) + '</div>' : '') +
        (e.desc ? '<div class="desc">' + bulletsAuto(e.desc) + '</div>' : '') + '</div>';
    }).join('');
  }
  function eduHTML() {
    return state.edu.filter(function (e) { return e.degree || e.school; }).map(function (e) {
      return '<div class="entry"><div class="entry-top"><span class="entry-title">' + esc(e.degree) + '</span>' +
        '<span class="entry-date">' + esc(e.dates) + '</span></div>' +
        (e.school ? '<div class="entry-sub">' + esc(e.school) + '</div>' : '') + '</div>';
    }).join('');
  }
  function certsHTML() {
    return state.certs.filter(function (c) { return c.name; }).map(function (c) {
      return '<div class="entry"><div class="entry-top"><span class="entry-title">' + esc(c.name) + '</span>' +
        '<span class="entry-date">' + esc(c.year) + '</span></div>' +
        (c.issuer ? '<div class="entry-sub">' + esc(c.issuer) + '</div>' : '') + '</div>';
    }).join('');

  function skillsHTML() {
    var arr = state.skills.split(/[,،\n]/).map(function (s) { return s.trim(); }).filter(Boolean);
    return arr.length ? '<div class="tags">' + arr.map(function (s) { return '<span class="tag">' + esc(s) + '</span>'; }).join('') + '</div>' : '';
  }
  function langsHTML() {
    return state.langs.filter(function (l) { return l.name; }).map(function (l) {
      return '<div class="lang-row"><span>' + esc(l.name) + '</span><span>' + esc(l.level) + '</span></div>';
    }).join('');

  function renderPreview() {
    var cv = $('#cv');
    cv.className = 'cv t-' + state.template;
    cv.style.setProperty('--a', state.accent);

    var name = state.name ? esc(state.name) : '<span class="ph">الاسم الكامل</span>';
    var role = state.title ? esc(state.title) : '<span class="ph">المسمى الوظيفي</span>';
    var summary = state.summary ? '<div class="desc"><p>' + esc(state.summary).replace(/\n/g, '<br>') + '</p></div>' : '';
    var html;

    if (state.template === 'side') {
      var side = photoHTML() + section('التواصل', contactItems()) + section('المهارات', skillsHTML()) + section('اللغات', langsHTML());
      var main = '<div class="head-main"><h1 class="name">' + name + '</h1><div class="role">' + role + '</div></div>' +

      html = '<aside class="side">' + side + '</aside><div class="main">' + main + '</div>';
    } else {
      html = '<header class="head">' + photoHTML() +
        '<div class="head-text"><h1 class="name">' + name + '</h1><div class="role">' + role + '</div>' + contactItems() + '</div></header>' +
        section('نبذة', summary) + section('الخبرات العملية', expHTML()) + section('التعليم', eduHTML()) +
        section('المهارات', skillsHTML()) + section('اللغات', langsHTML()) + section('الدورات والشهادات', certsHTML());
    }
    cv.innerHTML = html;
    fit();
  }

  /* ملاءمة الورقة لعرض العمود وإظهار حالة عدد الصفحات */
  function fit() {
    var stage = $('#stage'), wrap = $('#paperWrap'), cv = $('#cv');
    var w = stage.clientWidth;
    var scale = Math.min(1, w / 794);
    wrap.style.transform = 'scale(' + scale + ')';
    var h = cv.offsetHeight;
    stage.style.height = (h * scale) + 'px';
    var pages = Math.max(1, Math.ceil((h - 4) / A4_HEIGHT));
    var st = $('#pageStatus');
    if (pages > 1) { st.textContent = pages + ' صفحات، يُفضّل اختصار المحتوى'; st.classList.add('warn'); }
    else { st.textContent = 'صفحة واحدة'; st.classList.remove('warn'); }
  }

  /* ---------- القوائم الديناميكية ---------- */
  function renderList(key) {
    var cfg = LISTS[key], box = $('#list-' + key), arr = state[key];
    box.innerHTML = '';
    if (!arr.length) {
      var p = document.createElement('p'); p.className = 'empty'; p.textContent = 'لا توجد عناصر بعد.'; box.appendChild(p);
      return;
    }
    arr.forEach(function (item, i) {
      var el = document.createElement('div'); el.className = 'item';
      var head = document.createElement('div'); head.className = 'item-head';
      var b = document.createElement('b'); b.textContent = cfg.label + ' ' + (i + 1); head.appendChild(b);
      var tools = document.createElement('div'); tools.className = 'item-tools';
      tools.appendChild(toolBtn(SVG_UP, 'تحريك للأعلى', i === 0, function () { move(key, i, -1); }));
      tools.appendChild(toolBtn(SVG_DOWN, 'تحريك للأسفل', i === arr.length - 1, function () { move(key, i, 1); }));
      var del = toolBtn(SVG_DEL, 'حذف', false, function () { arr.splice(i, 1); renderList(key); renderPreview(); save(); });
      del.className += ' del'; tools.appendChild(del);
      head.appendChild(tools); el.appendChild(head);

      var grid = document.createElement('div'); grid.className = 'grid2';
      cfg.fields.forEach(function (f) {
        var wrap = document.createElement('div'); wrap.className = 'field' + (f.full ? ' full' : '');
        var id = key + '-' + item.id + '-' + f.k;
        var lab = document.createElement('label'); lab.htmlFor = id; lab.textContent = f.l; wrap.appendChild(lab);
        var inp;
        if (f.type === 'textarea') { inp = document.createElement('textarea'); inp.rows = 3; }
        else if (f.type === 'select') {
          inp = document.createElement('select');
          f.options.forEach(function (o) { var op = document.createElement('option'); op.textContent = o; op.value = o; inp.appendChild(op); });
        } else { inp = document.createElement('input'); inp.type = 'text'; }
        inp.id = id; if (f.ph) inp.placeholder = f.ph;
        inp.value = item[f.k] || '';
        inp.addEventListener('input', function () { item[f.k] = inp.value; renderPreview(); save(); });
        wrap.appendChild(inp); grid.appendChild(wrap);
      });
      el.appendChild(grid); box.appendChild(el);
    });

  function toolBtn(svg, label, disabled, fn) {
    var b = document.createElement('button'); b.type = 'button'; b.className = 'icon-btn';

    b.addEventListener('click', fn); return b;

  function move(key, i, d) {
    var arr = state[key], j = i + d;
    if (j < 0 || j >= arr.length) return;
    var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    renderList(key); renderPreview(); save();
  }

  /* ---------- ربط الواجهة ---------- */
  function syncEditor() {
    $$('[data-k]').forEach(function (el) { el.value = state[el.getAttribute('data-k')] || ''; });
    ['exp', 'edu', 'langs', 'certs'].forEach(renderList);
    $$('#tplRow .tpl').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.tpl === state.template)); });
    $$('#swatches .sw').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.c === state.accent)); });
    var cp = $('#customColor'); if (cp && /^#[0-9a-f]{6}$/i.test(state.accent)) cp.value = state.accent;
    $$('#genderSeg button').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.g === state.gender)); });
    renderChips(); renderPhotoThumb();
  }
  function renderChips() {
    var box = $('#chips'); box.innerHTML = '';
    SUGGESTIONS[state.gender].forEach(function (s) {
      var b = document.createElement('button'); b.type = 'button'; b.className = 'chip'; b.textContent = s[0];
      b.addEventListener('click', function () {
        state.summary = s[1]; $('#summary').value = s[1]; renderPreview(); save();
      });
      box.appendChild(b);
    });
  }
  function renderPhotoThumb() {
    var t = $('#photoThumb');
    if (state.photo) { t.style.backgroundImage = 'url("' + state.photo + '")'; t.innerHTML = ''; }
    else { t.style.backgroundImage = ''; t.innerHTML = '<svg viewBox="0 0 24 24"><circle cx="12" cy="9" r="3.5"/><path d="M5 20a7 7 0 0 1 14 0"/></svg>'; }
    $('#btnPhotoRemove').hidden = !state.photo;
  }
  function buildSwatches() {
    var box = $('#swatches');
    COLORS.forEach(function (c) {
      var b = document.createElement('button'); b.type = 'button'; b.className = 'sw'; b.style.background = c; b.dataset.c = c;
      b.setAttribute('aria-label', 'لون ' + c); b.setAttribute('aria-pressed', 'false');
      b.addEventListener('click', function () { setAccent(c); });
      box.appendChild(b);
    });
    var cp = document.createElement('input'); cp.type = 'color'; cp.id = 'customColor'; cp.className = 'sw-custom';
    cp.setAttribute('aria-label', 'لون مخصص'); cp.value = state.accent;
    cp.addEventListener('input', function () { setAccent(cp.value); });
    box.appendChild(cp);
  }
  function setAccent(c) {
    state.accent = c;
    $$('#swatches .sw').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.c === c)); });
    renderPreview(); save();
  }

  function resizePhoto(file, cb) {
    var rd = new FileReader();
    rd.onload = function () {
      var img = new Image();
      img.onload = function () {
        var size = 360, c = document.createElement('canvas'); c.width = c.height = size;
        var ctx = c.getContext('2d'), s = Math.min(img.width, img.height);
        ctx.drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, size, size);
        cb(c.toDataURL('image/jpeg', 0.85));
      };
      img.src = rd.result;
    };
    rd.readAsDataURL(file);
  }

  function download(name, text, type) {
    var blob = new Blob([text], { type: type }), a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  }

  function bind() {
    $$('[data-k]').forEach(function (el) {
      el.addEventListener('input', function () { state[el.getAttribute('data-k')] = el.value; renderPreview(); save(); });
    });
    $$('[data-add]').forEach(function (b) {
      b.addEventListener('click', function () {
        var k = b.getAttribute('data-add'), it = clone(LISTS[k].blank); it.id = uid();
        state[k].push(it); renderList(k); renderPreview(); save();
        var last = $('#list-' + k + ' .item:last-child input, #list-' + k + ' .item:last-child select');
        if (last) last.focus();
      });
    });
    $$('#tplRow .tpl').forEach(function (b) {
      b.addEventListener('click', function () {
        state.template = b.dataset.tpl;
        $$('#tplRow .tpl').forEach(function (x) { x.setAttribute('aria-pressed', String(x === b)); });
        renderPreview(); save();
      });
    });
    $$('#genderSeg button').forEach(function (b) {
      b.addEventListener('click', function () {
        state.gender = b.dataset.g;
        $$('#genderSeg button').forEach(function (x) { x.setAttribute('aria-pressed', String(x === b)); });
        renderChips(); save();
      });
    });
    $('#btnPhoto').addEventListener('click', function () { $('#photoFile').click(); });
    $('#photoFile').addEventListener('change', function (e) {
      var f = e.target.files[0]; if (!f) return;
      resizePhoto(f, function (data) { state.photo = data; renderPhotoThumb(); renderPreview(); save(); });
      e.target.value = '';
    });
    $('#btnPhotoRemove').addEventListener('click', function () { state.photo = ''; renderPhotoThumb(); renderPreview(); save(); });

    $('#btnPrint').addEventListener('click', function () { window.print(); });
    $('#btnSample').addEventListener('click', function () {
      if (confirmed('btnSample', 'اضغط مرة أخرى للاستبدال')) { state = clone(SAMPLE); state.exp.forEach(reid); state.edu.forEach(reid); state.langs.forEach(reid); syncEditor(); renderPreview(); save(); }
    });
    $('#btnClear').addEventListener('click', function () {
      if (confirmed('btnClear', 'اضغط مرة أخرى للمسح')) {
        var keep = { template: state.template, accent: state.accent, gender: state.gender };
        state = Object.assign(clone(EMPTY), keep); syncEditor(); renderPreview(); save();
      }
    });
    $('#btnExport').addEventListener('click', function () {
      var data = JSON.stringify(state, null, 2);
      download('cv-' + (state.name || 'data').replace(/\s+/g, '-') + '.json', data, 'application/json');
    });
    $('#btnImport').addEventListener('click', function () { $('#importFile').click(); });
    $('#importFile').addEventListener('change', function (e) {
      var f = e.target.files[0]; if (!f) return;
      var rd = new FileReader();
      rd.onload = function () {
        try { state = normalize(JSON.parse(rd.result)); syncEditor(); renderPreview(); save(); }
        catch (err) { flash($('#btnImport'), 'ملف غير صالح'); }
      };
      rd.readAsText(f); e.target.value = '';
    });
    window.addEventListener('resize', fit);
    if (window.ResizeObserver) new ResizeObserver(fit).observe($('#stage'));
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
  }
  function reid(it) { it.id = uid(); }

  /* تأكيد بضغطتين بدل نافذة confirm */
  var pending = {};
  function confirmed(id, msg) {
    var btn = document.getElementById(id);
    if (pending[id]) { clearTimeout(pending[id].t); btn.textContent = pending[id].label; pending[id] = null; return true; }
    var label = btn.textContent;
    btn.textContent = msg;
    pending[id] = { label: label, t: setTimeout(function () { btn.textContent = label; pending[id] = null; }, 2500) };
    return false;
  }
  function flash(btn, msg) {
    var old = btn.innerHTML; btn.textContent = msg;
    setTimeout(function () { btn.innerHTML = old; }, 2200);
  }

  buildSwatches();
  bind();
  syncEditor();
  renderPreview();
})();
</script>
</body>
</html>
